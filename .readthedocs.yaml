# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details
#
# NOTE: this depends on a not-yet-merged access-model-mkfigs PR that adds
# mkfigs.fetch and --notebooks-subdir. Until that lands and
# external/access-model-mkfigs's pin is bumped to include it, this build
# will fail at the pre_build step -- expected, not a bug in this file.

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    pre_build:
      # Downloads this repo's own experiments' rendered notebooks from
      # Figshare (same mechanism access-om3-paper-1 uses, pulled out into
      # the shared package). No-ops gracefully if none have been pushed
      # yet -- true on day one.
      - python3 -m mkfigs.fetch

submodules:
  include:
    - external/access-model-mkfigs
  recursive: false

mkdocs:
  configuration: documentation/mkdocs.yml

python:
  install:
    - requirements: documentation/requirements.txt
    # Installs mkfigs.fetch from the exact commit pinned in
    # external/access-model-mkfigs -- the same copy notebooks were run
    # with on NCI, not whatever happens to be newest on GitHub.
    - path: external/access-model-mkfigs
      method: pip
